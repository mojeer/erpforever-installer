name: Owner-only maintenance
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  close-outside-pr:
    if: github.event.pull_request.user.login != 'mojeer'
    runs-on: ubuntu-24.04
    steps:
      # Never check out or execute PR code. No untrusted input is embedded in shell text.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.update({owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.issue.number, state: 'closed'});
